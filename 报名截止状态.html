<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>报名已结束｜AI 科研加速营</title>
  <style>
    :root {
      --paper: #f6f5f0;
      --paper-light: #fffefa;
      --ink: #171b1f;
      --ink-soft: #575b60;
      --ink-faint: #888b8e;
      --blue: #0c3c80;
      --rule: rgba(58, 52, 42, .18);
    }
    * { box-sizing: border-box; }
    html { background: var(--paper); }
    body {
      min-width: 320px;
      min-height: 100dvh;
      margin: 0;
      display: flex;
      flex-direction: column;
      background:
        linear-gradient(rgba(58, 52, 42, .035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(58, 52, 42, .035) 1px, transparent 1px),
        var(--paper);
      background-size: 32px 32px;
      color: var(--ink);
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }
    img { max-width: 100%; }
    .container { width: min(calc(100% - 48px), 1100px); margin-inline: auto; }
    .topbar {
      height: 68px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: center;
      padding: 0 28px;
      border-bottom: 1px solid var(--rule);
      background: rgba(246, 245, 240, .96);
    }
    .brand { width: 168px; display: block; }
    .topnav { display: flex; align-items: center; gap: 34px; }
    .topnav a {
      padding: 22px 0 19px;
      border-bottom: 2px solid transparent;
      color: var(--ink);
      font-size: 16px;
      text-decoration: none;
    }
    .topnav a.active { border-bottom-color: var(--blue); color: var(--blue); }
    .account {
      justify-self: end;
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--blue);
      color: var(--paper-light);
      font: 600 15px/1 "Songti SC", "STSong", serif;
    }
    main { width: 100%; flex: 1 0 auto; }
    .result-wrap { padding-top: 60px; padding-bottom: 90px; }
    .result-card {
      padding: 28px 28px 44px;
      border: 1px solid var(--rule);
      background: var(--paper-light);
      text-align: center;
    }
    .result-heading {
      padding: 8px 0 26px;
      border-bottom: 1px solid var(--rule);
    }
    h1 {
      margin: 0;
      font-family: "Songti SC", "STSong", serif;
      font-size: clamp(34px, 4vw, 42px);
      font-weight: 500;
      line-height: 1.1;
    }
    .result-heading p {
      margin: 8px 0 0;
      color: var(--ink-soft);
      font-size: 15px;
      line-height: 1.7;
    }
    .qr {
      width: min(240px, 72%);
      aspect-ratio: 1;
      margin: 24px auto 18px;
      padding: 8px;
      display: block;
      border: 1px solid var(--rule);
      background: var(--paper-light);
      object-fit: contain;
    }
    .save-button {
      width: min(240px, 100%);
      min-height: 52px;
      margin: 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--ink);
      background: transparent;
      color: var(--ink);
      font-size: 15px;
      text-decoration: none;
    }
    .save-button:hover { border-color: var(--blue); color: var(--blue); }
    footer {
      padding-top: 56px;
      border-top: 1px solid var(--rule);
      background: var(--paper-light);
      color: var(--ink-soft);
    }
    .footer-main {
      display: grid;
      grid-template-columns: minmax(260px, 1.5fr) repeat(3, minmax(100px, .65fr)) minmax(170px, .8fr);
      gap: 36px 18px;
      align-items: start;
    }
    .footer-brand img { width: 168px; display: block; }
    .footer-brand small {
      display: block;
      margin-top: 22px;
      color: var(--ink-faint);
      font-size: 12px;
      line-height: 1.9;
    }
    .footer-column { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; }
    .footer-column b { margin-bottom: 4px; color: var(--ink-faint); font-size: 13px; letter-spacing: .08em; }
    .footer-column a { color: var(--ink-soft); font-size: 13px; text-decoration: none; }
    .footer-contact > a { color: var(--blue); overflow-wrap: anywhere; }
    .footer-qr { width: 104px; margin-top: 2px; padding: 5px; border: 1px solid var(--rule); background: var(--paper-light); }
    .footer-caption { color: var(--ink-faint); font-size: 12px; }
    .footer-bottom {
      margin-top: 50px;
      padding: 21px 0 25px;
      border-top: 1px solid var(--rule);
      color: var(--ink-faint);
      font-size: 10px;
      letter-spacing: .08em;
    }
    @media (max-width: 760px) {
      .container { width: min(calc(100% - 28px), 1100px); }
      .topbar { height: 62px; grid-template-columns: 1fr auto; padding: 0 14px; }
      .brand { width: 146px; }
      .topnav { gap: 18px; }
      .topnav a { padding: 19px 0 17px; font-size: 14px; }
      .account { display: none; }
      .result-wrap { padding-top: 28px; padding-bottom: 54px; }
      .result-card { padding: 22px 18px 34px; }
      .result-heading { padding-top: 4px; }
      .qr { width: 210px; }
      footer { padding-top: 42px; }
      .footer-main { grid-template-columns: 1fr 1fr; gap: 32px 24px; }
      .footer-brand, .footer-contact { grid-column: 1 / -1; }
    }
    @media (max-width: 480px) {
      .topnav a:first-child, .topnav a:last-child { display: none; }
      .footer-main { grid-template-columns: 1fr; }
      .footer-brand, .footer-contact { grid-column: auto; }
    }
  </style>
</head>
